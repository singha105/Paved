# Owner and SLO values are placeholders. The image is the test service (examples/testsvc),
# pushed to the cluster's registry by hack/testsvc-image.sh, until the real service exists.
apiVersion: platform.paved.dev/v1alpha1
kind: ServiceClaim
metadata:
  name: url-shortener
  namespace: platform-claims
spec:
  owner: team-links
  image: k3d-paved-registry:5001/testsvc:0.1.1
  port: 8080
  tier: public
  sli:
    type: http-availability
  slo:
    objective: "99.5"
    window: 28d
  scale:
    min: 2
    max: 5
