---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.paved.dev
  resources:
  - serviceclaims
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.paved.dev
  resources:
  - serviceclaims/finalizers
  verbs:
  - update
- apiGroups:
  - platform.paved.dev
  resources:
  - serviceclaims/status
  verbs:
  - get
  - patch
  - update
