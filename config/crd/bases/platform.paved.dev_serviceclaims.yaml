---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: serviceclaims.platform.paved.dev
spec:
  group: platform.paved.dev
  names:
    kind: ServiceClaim
    listKind: ServiceClaimList
    plural: serviceclaims
    singular: serviceclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.errorBudgetRemaining
      name: Budget
      type: string
    - jsonPath: .status.conditions[?(@.type=="DeploysFrozen")].status
      name: Frozen
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ServiceClaim is one developer's request for a production-shaped service. The
          controller reconciles it into its own namespace, svc-<name>.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ServiceClaim
            properties:
              image:
                minLength: 1
                type: string
              owner:
                minLength: 1
                type: string
              port:
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              scale:
                description: ScaleSpec bounds replica autoscaling. The tier may raise
                  the minimum.
                properties:
                  max:
                    format: int32
                    minimum: 1
                    type: integer
                  min:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - max
                - min
                type: object
              sli:
                description: SLISpec selects how "good" requests are measured.
                properties:
                  goodStatuses:
                    default:
                    - 200
                    - 201
                    - 204
                    - 301
                    - 302
                    - 304
                    - 400
                    - 404
                    description: Statuses counted as "good". Used by http-availability.
                    items:
                      format: int32
                      type: integer
                    type: array
                  latencyThreshold:
                    default: 250ms
                    description: Latency threshold for http-latency, e.g. "250ms".
                    type: string
                  type:
                    enum:
                    - http-availability
                    - http-latency
                    type: string
                required:
                - type
                type: object
              slo:
                description: SLOSpec is the objective the error budget is computed
                  from.
                properties:
                  objective:
                    description: |-
                      Target availability percentage, e.g. 99.5. A string, not a float, per Kubernetes
                      API conventions; the range is checked by CEL because Minimum/Maximum only apply
                      to numeric schema types (DECISIONS.md, ADR-004).
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                    x-kubernetes-validations:
                    - message: objective must be at least 90 and less than 100
                      rule: double(self) >= 90.0 && double(self) < 100.0
                  window:
                    default: 28d
                    enum:
                    - 7d
                    - 28d
                    - 30d
                    type: string
                required:
                - objective
                type: object
              storage:
                default: false
                description: |-
                  Storage gives the claim's pods an S3 bucket only they can use, through an IAM role they
                  assume with the cluster's service-account tokens, so no AWS key is stored anywhere
                  (DECISIONS.md, ADR-025). It takes effect on a cluster linked to an AWS account. It can't be
                  changed once the claim exists: paved never deletes objects it stops building, so turning it
                  off would leave a live role and bucket behind.
                type: boolean
                x-kubernetes-validations:
                - message: storage cannot be changed after the claim is created
                  rule: self == oldSelf
              tier:
                enum:
                - public
                - internal
                - batch
                type: string
            required:
            - image
            - owner
            - port
            - scale
            - sli
            - slo
            - tier
            type: object
          status:
            description: status defines the observed state of ServiceClaim
            properties:
              burnRate1h:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              errorBudgetRemaining:
                type: string
              lastReconcileTime:
                format: date-time
                type: string
              managedResources:
                type: integer
              observedGeneration:
                format: int64
                type: integer
              storage:
                description: Storage names the claim's bucket and the role its pods
                  assume, when it has storage.
                properties:
                  bucket:
                    description: Bucket is the name of the claim's S3 bucket.
                    type: string
                  roleARN:
                    description: RoleARN is the IAM role the claim's pods assume.
                    type: string
                required:
                - bucket
                - roleARN
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a claim with storage needs a name of at most 48 characters, so
            its bucket name fits in S3's 63
          rule: '!has(self.spec.storage) || !self.spec.storage || size(self.metadata.name)
            <= 48'
    served: true
    storage: true
    subresources:
      status: {}
